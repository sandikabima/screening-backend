name: Deploy Backend Screening

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Sync Dist & Package Files to VPS
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-rtzv --delete"
          SOURCE: "dist/ package.json package-lock.json"
          REMOTE_HOST: ${{ secrets.VPS_IP }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: "/var/www/backend-screening"
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          EXCLUDE: "/node_modules/, /.env"

      - name: Install Production Dependencies & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/backend-screening

            # Pasang node_modules khusus production
            npm ci --omit=dev

            # Jalankan entrypoint hasil build (misal dist/main.js atau dist/index.js)
            pm2 describe backend-screening > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              pm2 reload backend-screening
            else
              pm2 start dist/main.js --name "backend-screening"
            fi
            pm2 save
